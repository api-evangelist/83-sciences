name: 83 Sciences
description: >-
  83 Sciences is an AI-native materials-discovery company (Y Combinator Summer 2026)
  that helps research labs unlock value from unpublished and discarded experimental
  data. Roughly 90% of experimental data never reaches publication; 83 Sciences works
  on-site with researchers to capture and structure that hidden data into a queryable
  database, then applies AI-powered analysis and generative models to learn from a
  lab's full experimental history — including failed experiments — to surface novel
  materials, co-authored manuscripts, and patents. Founded by researchers from MIT,
  Stanford, Harvard, and Columbia and based in San Francisco. The company currently
  ships no public API or developer surface; this profile tracks its identity for the
  API Evangelist network.
